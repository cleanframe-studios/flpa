{% extends 'portal/base.html' %}
{% block page_title %}A birthday surprise for {{ student.first_name }}{% endblock %}
{% block content %}
{% include 'portal/partials/birthday_celebration_modal.html' %}
<script>
(() => {
  const modal = document.querySelector('[data-birthday-modal]');
  if (!modal) return;
  modal.dataset.open = 'true';
  requestAnimationFrame(() => {
    modal.setAttribute('aria-hidden', 'false');
    modal.classList.remove('opacity-0');
    modal.classList.add('opacity-100');
  });
  const scenes = Array.from(modal.querySelectorAll('[data-birthday-scene]'));
  const nextButton = modal.querySelector('[data-next-birthday-scene]');
  const slideDuration = 8500;
  let slideTimer;
  let activeScene = 0;
  const progress = modal.querySelector('[data-birthday-slide-progress]');
  if (!scenes.length || !nextButton) return;

  function launchBirthdayConfetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const layer = modal.querySelector('[data-birthday-confetti]');
    if (!layer) return;
    const colours = [
      'var(--birthday-gradient-start)',
      'var(--birthday-gradient-end)',
      'color-mix(in srgb, var(--birthday-gradient-start), white 38%)',
      'color-mix(in srgb, var(--birthday-gradient-end), #facc15 28%)',
      '#facc15',
    ];
    for (let index = 0; index < 28; index += 1) {
      const piece = document.createElement('span');
      piece.className = 'birthday-confetti-piece';
      piece.style.setProperty('--confetti-colour', colours[index % colours.length]);
      piece.style.setProperty('--confetti-x', `${Math.round(Math.random() * 420 - 210)}px`);
      piece.style.setProperty('--confetti-y', `${Math.round(Math.random() * 460 - 230)}px`);
      piece.style.setProperty('--confetti-rotation', `${Math.round(Math.random() * 720 - 360)}deg`);
      piece.style.animationDelay = `${Math.random() * 100}ms`;
      layer.appendChild(piece);
      window.setTimeout(() => piece.remove(), 1300);
    }
  }

  function closeCelebration() {
    if (modal.dataset.closing === 'true') return;
    window.clearTimeout(slideTimer);
    modal.dataset.closing = 'true';
    modal.setAttribute('aria-hidden', 'true');
    modal.classList.remove('opacity-100');
    modal.classList.add('opacity-0');
    window.setTimeout(() => window.location.assign("{% url 'inbox' %}"), 300);
  }

  function showBirthdayScene(index) {
    scenes.forEach((scene, sceneIndex) => {
      scene.classList.toggle('hidden', sceneIndex !== index);
      scene.classList.toggle('is-active', sceneIndex === index);
      scene.setAttribute('aria-hidden', String(sceneIndex !== index));
    });
    activeScene = index;
    const finalScene = activeScene === scenes.length - 1;
    nextButton.querySelector('[data-next-label]').textContent = finalScene ? 'Finish' : 'Next';
    nextButton.querySelector('[data-next-icon]').classList.toggle('hidden', finalScene);
    if (progress) {
      progress.classList.remove('is-running');
      if (!finalScene) {
        progress.style.animationDuration = `${slideDuration}ms`;
        void progress.offsetWidth;
        progress.classList.add('is-running');
      }
    }
    if (activeScene === 0 || finalScene) launchBirthdayConfetti();
    window.clearTimeout(slideTimer);
    if (!finalScene) {
      slideTimer = window.setTimeout(() => showBirthdayScene(activeScene + 1), slideDuration);
    }
  }

  showBirthdayScene(activeScene);

  nextButton?.addEventListener('click', () => {
    if (activeScene === scenes.length - 1) {
      closeCelebration();
      return;
    }
    showBirthdayScene(activeScene + 1);
  });

  modal.addEventListener('click', event => {
    if (event.target.closest('[data-birthday-close]') || event.target.closest('[data-birthday-backdrop-close]')) {
      event.preventDefault();
      closeCelebration();
    }
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeCelebration();
  });
})();
</script>
{% endblock %}

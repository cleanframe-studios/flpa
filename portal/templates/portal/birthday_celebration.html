{% extends 'portal/base.html' %}
{% block page_title %}A birthday surprise for {{ student.first_name }}{% endblock %}
{% block content %}
{% include 'portal/partials/birthday_celebration_modal.html' %}
<script>
(() => {
  const modal = document.querySelector('[data-birthday-modal]');
  if (!modal) return;
  modal.dataset.open = 'true';
  modal.setAttribute('aria-hidden', 'false');
  modal.classList.remove('opacity-0');
  modal.classList.add('opacity-100');
  const scenes = Array.from(modal.querySelectorAll('[data-birthday-scene]'));
  const dots = Array.from(modal.querySelectorAll('[data-scene-dot]'));
  const nextButton = modal.querySelector('[data-next-birthday-scene]');
  const counter = modal.querySelector('[data-scene-counter]');
  let activeScene = 0;
  nextButton?.addEventListener('click', () => {
    scenes[activeScene].classList.add('hidden');
    scenes[activeScene].classList.remove('is-active');
    activeScene = (activeScene + 1) % scenes.length;
    scenes[activeScene].classList.remove('hidden');
    void scenes[activeScene].offsetWidth;
    scenes[activeScene].classList.add('is-active');
    dots.forEach((dot, index) => {
      dot.classList.toggle('w-6', index === activeScene);
      dot.classList.toggle('w-3', index !== activeScene);
      dot.classList.toggle('bg-white', index === activeScene);
      dot.classList.toggle('bg-white/25', index !== activeScene);
    });
    counter.textContent = `0${activeScene + 1} / 0${scenes.length}`;
    const finalScene = activeScene === scenes.length - 1;
    nextButton.querySelector('span').textContent = finalScene ? 'Celebrate again' : 'Continue';
    nextButton.querySelector('svg').classList.toggle('rotate-180', finalScene);
  });
})();
</script>
{% endblock %}

<button id="surprise-trigger" type="button" class="group fixed bottom-8 left-8 z-[9000] flex h-16 w-16 items-center justify-center rounded-full bg-gradient-to-r from-purple-500 to-pink-500 text-2xl shadow-2xl shadow-purple-500/40 animate-pulse transition-transform duration-150 hover:-translate-y-1 hover:shadow-pink-500/50 active:scale-95 active:translate-y-0" aria-label="Click for a surprise"><span aria-hidden="true" class="transition-transform duration-300 group-hover:rotate-12 group-hover:scale-110">&#127873;</span><span class="pointer-events-none absolute bottom-full left-0 mb-3 whitespace-nowrap rounded-lg bg-slate-900 px-3 py-2 text-xs font-semibold text-white opacity-0 shadow-xl transition-opacity duration-200 group-hover:opacity-100">Click for a surprise!</span></button>
	<div id="surprise-modal" class="fixed inset-0 z-[9999] hidden items-center justify-center bg-slate-900/60 p-4 backdrop-blur-md" role="dialog" aria-modal="true" aria-labelledby="surprise-title"><div class="relative w-full max-w-2xl rounded-[2rem] border border-white/20 bg-white/15 p-6 text-white shadow-2xl backdrop-blur-2xl sm:p-8"><button id="surprise-close" type="button" class="absolute right-5 top-4 text-3xl leading-none text-white/70 transition hover:text-white active:scale-95" aria-label="Close surprise">&times;</button><div id="surprise-prompt" class="py-8 text-center sm:py-12"><p class="text-5xl" aria-hidden="true">&#10024;</p><h2 id="surprise-title" class="mt-5 text-2xl font-black sm:text-3xl">&#10024; You found a secret! Do you want to see what we created?</h2><div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row"><button id="surprise-yes" type="button" class="rounded-full bg-gradient-to-r from-purple-500 to-pink-500 px-6 py-3.5 text-sm font-black text-white shadow-xl shadow-pink-500/25 transition-transform duration-150 hover:-translate-y-1 hover:shadow-2xl active:scale-95 active:translate-y-0">Yes, show me!</button><button id="surprise-later" type="button" class="rounded-full border border-white/25 bg-white/10 px-6 py-3.5 text-sm font-bold text-white/80 transition-transform duration-150 hover:bg-white/20 active:scale-95 active:translate-y-0">Maybe later</button></div></div><div id="surprise-reveal" class="hidden"><p class="text-xs font-bold uppercase tracking-[0.2em] text-pink-200">A special presentation</p><h2 class="mt-3 text-2xl font-black sm:text-3xl">Surprise! We made a movie! &#127916;</h2><p class="mt-2 text-sm font-semibold text-purple-100">Ewà Àṣà Ìlẹ̀ Yorùbá - The Beauty Of Yoruba Culture</p><iframe id="surprise-video" loading="lazy" class="mt-4 aspect-video w-full rounded-2xl shadow-2xl" data-video-src="https://www.youtube.com/embed/KjUaSlihAeQ?autoplay=1&mute=0&loop=1&playlist=KjUaSlihAeQ" title="Ewa Asa Ile Yoruba - The Beauty Of Yoruba Culture" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><p class="mt-4 rounded-full border border-white/20 bg-white/10 px-4 py-3 text-center text-sm font-bold text-white/90">&#127871; Another Blockbuster is Coming Soon...</p><div class="mt-6 flex flex-col gap-3 sm:flex-row"><a href="https://www.youtube.com/watch?v=KjUaSlihAeQ" target="_blank" rel="noopener noreferrer" class="flex-1 rounded-full bg-white px-5 py-3 text-center text-sm font-black text-blue-950 transition-transform duration-150 hover:-translate-y-1 hover:shadow-xl active:scale-95 active:translate-y-0">Watch on YouTube</a><button id="surprise-done" type="button" class="flex-1 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 px-5 py-3 text-sm font-black text-white transition-transform duration-150 hover:-translate-y-1 hover:shadow-xl active:scale-95 active:translate-y-0">Awesome! Close</button></div></div></div></div>
				<style>
					@keyframes surpriseModalIn { 0% { opacity: 0; transform: scale(.82) translateY(28px) rotate(-2deg); } 65% { transform: scale(1.03) translateY(-4px) rotate(.5deg); } 100% { opacity: 1; transform: scale(1) translateY(0) rotate(0); } }
					@keyframes surpriseRevealIn { 0% { opacity: 0; transform: scale(.72) rotate(-4deg); filter: blur(8px); } 65% { transform: scale(1.03) rotate(.5deg); } 100% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); } }
					@keyframes surpriseSpark { 0% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-72px) scale(0); } }
					#surprise-modal.surprise-modal-enter > div { animation: surpriseModalIn .65s cubic-bezier(.16, 1, .3, 1) both; }
					#surprise-reveal.surprise-reveal-enter { animation: surpriseRevealIn .7s cubic-bezier(.16, 1, .3, 1) both; }
					  #surprise-close, #surprise-close:hover, #surprise-close:active { transform: none !important; }
					.surprise-spark { position: fixed; z-index: 10000; width: 10px; height: 24px; border-radius: 999px; pointer-events: none; animation: surpriseSpark .8s cubic-bezier(.2, .8, .3, 1) forwards; }
					@media (prefers-reduced-motion: reduce) { #surprise-modal.surprise-modal-enter > div, #surprise-reveal.surprise-reveal-enter, .surprise-spark { animation: none; } }
				</style>
				<script>(function () { var trigger = document.getElementById('surprise-trigger'); var modal = document.getElementById('surprise-modal'); var prompt = document.getElementById('surprise-prompt'); var reveal = document.getElementById('surprise-reveal'); var video = document.getElementById('surprise-video'); if (!trigger || !modal || !prompt || !reveal || !video) return; function celebrate(origin, count) { var colors = ['#f472b6', '#c084fc', '#60a5fa', '#facc15', '#ffffff']; for (var index = 0; index < count; index += 1) { var spark = document.createElement('span'); spark.className = 'surprise-spark'; spark.style.left = origin.x + 'px'; spark.style.top = origin.y + 'px'; spark.style.setProperty('--angle', (index * (360 / count)) + 'deg'); spark.style.backgroundColor = colors[index % colors.length]; document.body.appendChild(spark); window.setTimeout(function () { spark.remove(); }, 850); } } function closeSurprise() { modal.classList.add('hidden'); modal.classList.remove('flex', 'surprise-modal-enter'); prompt.classList.remove('hidden'); reveal.classList.add('hidden'); reveal.classList.remove('surprise-reveal-enter'); video.removeAttribute('src'); } trigger.addEventListener('click', function () { modal.classList.remove('hidden'); modal.classList.add('flex', 'surprise-modal-enter'); celebrate({ x: trigger.getBoundingClientRect().left + trigger.offsetWidth / 2, y: trigger.getBoundingClientRect().top + trigger.offsetHeight / 2 }, 12); }); document.getElementById('surprise-yes').addEventListener('click', function () { video.src = video.dataset.videoSrc; prompt.classList.add('hidden'); reveal.classList.remove('hidden'); reveal.classList.add('surprise-reveal-enter'); celebrate({ x: window.innerWidth / 2, y: window.innerHeight / 2 }, 18); }); document.getElementById('surprise-later').addEventListener('click', closeSurprise); document.getElementById('surprise-done').addEventListener('click', closeSurprise); document.getElementById('surprise-close').addEventListener('click', closeSurprise); modal.addEventListener('click', function (event) { if (event.target === modal) closeSurprise(); }); })();</script>

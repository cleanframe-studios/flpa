{% extends 'portal/base.html' %}
{% block page_title %}Document Hub{% endblock %}
{% block content %}
<div class="min-h-full bg-slate-100 p-6 lg:p-8">
  <div class="mx-auto max-w-5xl space-y-6">
    <div class="rounded-3xl bg-gradient-to-r from-cyan-900 via-cyan-800 to-slate-900 p-8 text-white shadow-lg">
      <p class="text-xs font-bold uppercase tracking-[0.2em] text-cyan-200">Admissions &amp; Enrollment</p>
      <h1 class="mt-2 text-2xl font-black">Document Hub</h1>
      <p class="mt-1 text-sm text-cyan-100">Centralized storage for admission and enrollment documents.</p>
    </div>

    <div class="rounded-3xl border border-slate-200 bg-white p-10 text-center shadow-sm">
      <svg class="mx-auto h-12 w-12 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
      <h2 class="mt-4 text-lg font-bold text-slate-900">Coming Soon</h2>
      <p class="mt-1 text-sm text-slate-500">Document uploads and admission records will be managed from here.</p>
    </div>
  </div>
</div>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="{% static 'portal/css/global.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: 
                radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
                linear-gradient(135deg, rgba(9, 13, 22, 0.85) 0%, rgba(30, 58, 138, 0.8) 40%, rgba(127, 29, 29, 0.8) 80%, rgba(69, 10, 10, 0.9) 100%),

            min-height: 100vh;

<body class="font-sans antialiased flex flex-col min-h-screen justify-between">
